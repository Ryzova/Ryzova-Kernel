name: Terminal 5B native C builds
on:
  pull_request:
    paths:
      - scripts/ryz_build.py
      - examples/terminal5c/**
      - ryzova/compat/win32-source/**
      - examples/terminal5b/**
      - .github/workflows/terminal-5b.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-sources
          path: |
            scripts/ryz_build.py
            examples/terminal5b/
            examples/terminal5c/
            ryzova/compat/win32-source/
  build-and-run:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux}
          - {os: windows-latest, target: windows}
          - {os: macos-latest, target: macos}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: terminal-sources
      - name: Compile and verify checksum and error exits
        shell: python
        run: |
          import pathlib, subprocess, sys
          target = "${{ matrix.target }}"
          path = subprocess.check_output([sys.executable, "scripts/ryz_build.py", target, "examples/terminal5b/checksum.c"], text=True).strip()
          sample = pathlib.Path("sample.bin")
          sample.write_bytes(b"hello")
          result = subprocess.run([path, str(sample)], capture_output=True, text=True, check=True)
          assert result.stdout.splitlines() == ["4f9f2cab"]
          assert subprocess.run([path, "missing.bin"]).returncode == 1
          assert subprocess.run([path]).returncode == 2
      - name: Exercise Win32 directory contract
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          binary = subprocess.check_output([sys.executable, "scripts/ryz_build.py", "${{ matrix.target }}", "examples/terminal5c/directory.c", "--win32-source"], text=True).strip()
          with tempfile.TemporaryDirectory() as workspace:
              subprocess.run([pathlib.Path(binary).resolve()], cwd=workspace, check=True)
              assert not list(pathlib.Path(workspace).iterdir())
      - name: Package CLI and verify a clean installation
        shell: python
        run: |
          import hashlib, json, pathlib, shutil, subprocess, tempfile, zipfile
          target = "${{ matrix.target }}"
          name = "checksum.exe" if target == "windows" else "checksum"
          binary = pathlib.Path("build", target, name)
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          package = pathlib.Path(f"checksum-{target}-amd64.zip")
          with zipfile.ZipFile(package, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(binary, name)
              archive.writestr("manifest.json", json.dumps(dict(target=target, arch="amd64", binary=name, sha256=digest)))
          with tempfile.TemporaryDirectory() as temp:
              install = pathlib.Path(temp)
              shutil.unpack_archive(package, install)
              manifest = json.loads((install / "manifest.json").read_text())
              executable = install / manifest["binary"]
              assert hashlib.sha256(executable.read_bytes()).hexdigest() == digest == manifest["sha256"]
              executable.chmod(0o755)
              (install / "sample").write_bytes(b"hello")
              output = subprocess.check_output([executable, "sample"], cwd=install, text=True)
              assert output.splitlines() == ["4f9f2cab"]
      - uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.target }}-amd64
          path: checksum-${{ matrix.target }}-amd64.zip
          if-no-files-found: error
  qualify:
    needs: build-and-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*-amd64
          path: packages
      - name: Verify the published three-platform package set
        shell: python
        run: |
          import hashlib, json, pathlib, struct, zipfile
          root = pathlib.Path("packages")
          targets = ("linux", "windows", "macos")
          expected = {f"checksum-{target}-amd64" for target in targets}
          assert {p.name for p in root.iterdir()} == expected
          for target in targets:
              package = f"checksum-{target}-amd64"
              name = "checksum.exe" if target == "windows" else "checksum"
              with zipfile.ZipFile(root / package / (package + ".zip")) as archive:
                  assert sorted(archive.namelist()) == sorted([name, "manifest.json"])
                  data = archive.read(name)
                  manifest = json.loads(archive.read("manifest.json"))
              assert manifest == dict(target=target, arch="amd64", binary=name, sha256=hashlib.sha256(data).hexdigest())
              if target == "windows":
                  assert data[:2] == b"MZ"
                  offset = struct.unpack_from("<I", data, 60)[0]
                  assert data[offset:offset+6] == bytes.fromhex("504500006486")
              elif target == "linux":
                  assert data[:6] == bytes.fromhex("7f454c460201")
                  assert struct.unpack_from("<H", data, 18)[0] == 62
              else:
                  assert data[:8] == bytes.fromhex("cffaedfe07000001")
              print(target, manifest["sha256"])
